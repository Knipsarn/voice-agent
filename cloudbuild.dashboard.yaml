steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - Dockerfile.dashboard
      - -t
      - gcr.io/ldk-clean/dashboard-service
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - gcr.io/ldk-clean/dashboard-service

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - dashboard-service
      - --image=gcr.io/ldk-clean/dashboard-service:latest
      - --region=europe-west1
      - --project=ldk-clean
      - --update-secrets=NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,CONTROL_PLANE_API_KEY=CONTROL_PLANE_API_KEY:latest
      - --set-env-vars=CONTROL_PLANE_BASE_URL=https://control-plane-service-360579353014.europe-west1.run.app,DASHBOARD_ADMIN_EMAILS=nils.wahlin@snmintegrations.se,NEXTAUTH_URL=https://dashboard-service-360579353014.europe-west1.run.app
      - --allow-unauthenticated
      - --no-cpu-throttling
      - --min-instances=0
      - --max-instances=10
      - --quiet

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - dashboard-service
      - --to-latest
      - --region=europe-west1
      - --project=ldk-clean

images:
  - gcr.io/ldk-clean/dashboard-service

options:
  logging: CLOUD_LOGGING_ONLY
